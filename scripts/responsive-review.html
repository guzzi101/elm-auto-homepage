<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Elm Auto layout review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#dce3df;color:#14221e;font:14px/1.4 Arial,sans-serif}header{padding:16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:#fff;position:sticky;top:0;z-index:2;border-bottom:1px solid #bccac1}label{display:flex;align-items:center;gap:6px}select,button{font:inherit;min-height:36px;padding:6px 10px}main{padding:24px;overflow:auto}iframe{display:block;border:0;background:#fff;box-shadow:0 2px 14px #14221e20;width:390px;height:844px;margin:auto}output{margin-left:auto}</style></head>
<body><header><strong>Elm Auto responsive review</strong><label>Viewport <select id="width"><option>320</option><option>360</option><option>375</option><option selected>390</option><option>430</option><option>600</option><option>768</option><option>820</option><option>1024</option><option>1280</option><option>1440</option><option>1920</option></select></label><label>Section <select id="section"><option value="hero">Hero</option><option value="customers">Customers</option><option value="process">Process</option><option value="questions">Questions</option><option value="reviews">Reviews</option><option value="delivery">Delivery</option><option value="footer">Footer</option></select></label><button id="full" aria-pressed="false">Full page</button><button id="text" aria-pressed="false">Double text</button><button id="reload">Reload preview</button><output id="status"></output></header><main><iframe id="preview" title="Elm Auto homepage preview" src="./index.html"></iframe></main>
<script>
const frame=document.querySelector('#preview');
let full=false, large=false;
function size(){frame.style.width=document.querySelector('#width').value+'px';frame.style.height=full?frame.contentDocument.documentElement.scrollHeight+'px':'844px';setTimeout(report,150);}
function report(){const doc=frame.contentDocument;document.querySelector('#status').textContent=doc.documentElement.clientWidth+'px content / '+doc.documentElement.scrollWidth+'px page';}
document.querySelector('#width').addEventListener('change',size);
document.querySelector('#section').addEventListener('change',event=>{const key=event.target.value;frame.contentDocument.querySelector(key==='hero'?'.header':key==='questions'?'.questions':key==='footer'?'.footer':'#'+key).scrollIntoView({behavior:'instant'});report();});
document.querySelector('#full').addEventListener('click',event=>{full=!full;event.target.setAttribute('aria-pressed',String(full));frame.style.height='844px';size();});
document.querySelector('#text').addEventListener('click',event=>{large=!large;event.target.setAttribute('aria-pressed',String(large));frame.contentDocument.documentElement.style.fontSize=large?'34px':'';size();});
document.querySelector('#reload').addEventListener('click',()=>{frame.contentWindow.location.reload();});
frame.addEventListener('load',size);
</script></body></html>
