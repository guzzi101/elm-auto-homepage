<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Elm Auto layout review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#dce3df;color:#14221e;font:14px/1.4 Arial,sans-serif}header{padding:16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:#fff;position:sticky;top:0;z-index:2;border-bottom:1px solid #bccac1}label{display:flex;align-items:center;gap:6px}select,button{font:inherit;min-height:36px;padding:6px 10px}main{padding:24px;overflow:auto}iframe{display:block;border:0;background:#fff;box-shadow:0 2px 14px #14221e20;width:390px;height:844px;margin:auto}output{margin-left:auto}</style></head>
<body><header><strong>Elm Auto responsive review</strong><label>Viewport <select id="width"><option>320</option><option>360</option><option>375</option><option selected>390</option><option>430</option><option>600</option><option>768</option><option>820</option><option>1024</option><option>1280</option><option>1440</option><option>1920</option></select></label><label>Height <select id="height"><option>568</option><option>667</option><option selected>844</option><option>1080</option></select></label><label>Page <select id="page"><option value="home">Homepage</option><option value="application">Application</option></select></label><label>Section <select id="section"><option value="hero">Hero</option><option value="customers">Customers</option><option value="process">Process</option><option value="questions">Questions</option><option value="reviews">Reviews</option><option value="delivery">Delivery</option><option value="footer">Footer</option></select></label><button id="full" aria-pressed="false">Full page</button><button id="text" aria-pressed="false">Double text</button><button id="scripts" aria-pressed="false">Without JavaScript</button><button id="campaign" aria-pressed="false">Campaign test</button><button id="reload">Reload preview</button><output id="status"></output></header><main><iframe id="preview" title="Elm Auto homepage preview" src="./index.html"></iframe></main>
<script>
const frame=document.querySelector('#preview');
let full=false, large=false, noScripts=false, campaign=false;
function home(){return document.querySelector('#page').value==='home'}
function report(){try{const root=frame.contentDocument.documentElement;document.querySelector('#status').textContent=root.clientWidth+'px content / '+root.scrollWidth+'px page';}catch{document.querySelector('#status').textContent='Application preview';}}
function size(){frame.style.width=document.querySelector('#width').value+'px';frame.style.height=document.querySelector('#height').value+'px';try{if(full&&home())frame.style.height=frame.contentDocument.documentElement.scrollHeight+'px';}catch{}setTimeout(report,150);}
function load(){frame.src=home()?'./index.html'+(campaign?'?utm_source=qa&utm_medium=test&utm_campaign=journey-audit&gclid=qa-click':''):'https://www.elmautocredit.ca/get-approved/';}
document.querySelector('#width').addEventListener('change',size);
document.querySelector('#height').addEventListener('change',size);
document.querySelector('#page').addEventListener('change',()=>{if(!home()){frame.removeAttribute('sandbox');noScripts=false;document.querySelector('#scripts').setAttribute('aria-pressed','false');}load()});
document.querySelector('#section').addEventListener('change',event=>{if(!home())return;const key=event.target.value;frame.contentDocument.querySelector(key==='hero'?'.header':key==='footer'?'.footer':'#'+key).scrollIntoView({behavior:'instant'});report();});
document.querySelector('#full').addEventListener('click',event=>{full=!full;event.target.setAttribute('aria-pressed',String(full));size();});
document.querySelector('#text').addEventListener('click',event=>{if(!home())return;large=!large;event.target.setAttribute('aria-pressed',String(large));frame.contentDocument.documentElement.style.fontSize=large?'34px':'';size();});
document.querySelector('#scripts').addEventListener('click',event=>{if(!home())return;noScripts=!noScripts;event.target.setAttribute('aria-pressed',String(noScripts));if(noScripts)frame.setAttribute('sandbox','allow-same-origin');else frame.removeAttribute('sandbox');load();});
document.querySelector('#campaign').addEventListener('click',event=>{if(!home())return;campaign=!campaign;event.target.setAttribute('aria-pressed',String(campaign));load();});
document.querySelector('#reload').addEventListener('click',()=>{load();});
frame.addEventListener('load',()=>{if(home()){frame.contentDocument.documentElement.style.fontSize=large?'34px':'';}size();});
</script></body></html>
